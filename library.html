<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>المكتبة | Coach Haidar</title> <script src="https://cdn.tailwindcss.com"></script> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <link rel="stylesheet" href="style.css"> </head> <body class="bg-[#0b1120] text-slate-200 pb-12"> <header class="bg-slate-900/90 border-b border-yellow-400/20 p-4 sticky top-0 z-50 backdrop-blur-md"> <div class="max-w-4xl mx-auto flex items-center justify-between"> <div class="flex items-center gap-4"> <a href="index.html" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-yellow-400 border border-white/5 hover:bg-yellow-400 hover:text-[#0b1120] transition-all"> <i class="fas fa-arrow-right"></i> </a> <div> <h1 class="text-xl font-black italic text-yellow-400 uppercase tracking-tighter">مكتبة التمارين</h1> <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">النماذج المحفوظة مسبقاً</p> </div> </div> </div> </header> <main class="max-w-4xl mx-auto mt-8 px-4"> <div id="emptyState" class="hidden text-center py-20 space-y-4"> <div class="w-20 h-20 bg-slate-800/50 rounded-full flex items-center justify-center mx-auto text-slate-600 text-3xl"> <i class="fas fa-folder-open"></i> </div> <p class="text-slate-400 font-bold">لا توجد نماذج محفوظة حالياً</p> <a href="index.html" class="inline-block text-yellow-400 text-sm font-black underline">ابدأ بإنشاء أول برنامج الآن</a> </div> <div id="templatesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div> </main> <div id="confirmModal" class="fixed inset-0 bg-[#0b1120]/95 backdrop-blur-md z-[250] hidden items-center justify-center p-4"> <div class="bg-slate-900 border border-red-500/20 w-full max-w-sm rounded-3xl p-8 shadow-2xl text-center space-y-6"> <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto text-red-500 text-3xl border border-red-500/20"> <i class="fas fa-trash-alt"></i> </div> <div class="space-y-2"> <h3 class="text-xl font-black text-white">حذف النموذج؟</h3> <p class="text-slate-400 text-sm">هل أنت متأكد من حذف هذا النموذج نهائياً؟ لا يمكن استعادة البيانات بعد الحذف.</p> </div> <div class="flex gap-3"> <button onclick="closeConfirmModal()" class="flex-1 py-4 bg-slate-800 text-slate-300 rounded-2xl font-bold text-sm hover:bg-slate-700 transition-all">إلغاء</button> <button id="confirmDeleteBtn" class="flex-1 py-4 bg-red-500 text-white rounded-2xl font-black text-sm hover:bg-red-600 transition-all shadow-[0_10px_20px_rgba(239,68,68,0.2)]">تأكيد الحذف</button> </div> </div> </div> <script>let indexToDelete=null;function displayTemplates(){const e=document.getElementById("templatesGrid"),t=document.getElementById("emptyState"),n=JSON.parse(localStorage.getItem("workoutTemplates")||"[]");if(0===n.length)return e.innerHTML="",void t.classList.remove("hidden");t.classList.add("hidden"),e.innerHTML=n.map((e,t)=>` <div class="bg-slate-800/40 border border-white/5 p-5 rounded-2xl hover:border-yellow-400/30 transition-all group"> <div class="flex justify-between items-start mb-4"> <div class="space-y-1"> <h3 class="text-lg font-black text-white group-hover:text-yellow-400 transition-colors">${e.templateName}</h3> <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider"> <i class="far fa-calendar-alt ml-1"></i> ${e.date} </p> <p class="text-[9px] text-yellow-400/60 font-bold italic">اللاعب: ${e.playerName||"غير محدد"}</p> </div> <button onclick="openConfirmModal(${t})" class="w-8 h-8 rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center text-xs"> <i class="fas fa-trash-alt"></i> </button> </div> <div class="flex items-center justify-between mt-6"> <div class="flex items-center gap-2"> <div class="w-7 h-7 rounded-full bg-yellow-400 flex items-center justify-center text-[#0b1120] text-[10px] font-black">${e.days.length}</div> <span class="text-[10px] text-slate-400 font-bold uppercase">أقسام</span> </div> <button onclick="loadTemplate(${t})" class="bg-yellow-400 text-[#0b1120] px-4 py-2 rounded-xl font-black text-xs hover:bg-yellow-500 transition-all flex items-center gap-2"> تحميل <i class="fas fa-external-link-alt text-[10px]"></i> </button> </div> </div> `).join("")}function openConfirmModal(e){indexToDelete=e,document.getElementById("confirmModal").classList.remove("hidden"),document.getElementById("confirmModal").classList.add("flex"),document.getElementById("confirmDeleteBtn").onclick=executeDelete}function closeConfirmModal(){document.getElementById("confirmModal").classList.add("hidden"),document.getElementById("confirmModal").classList.remove("flex"),indexToDelete=null}function executeDelete(){if(null!==indexToDelete){let e=JSON.parse(localStorage.getItem("workoutTemplates")||"[]");e.splice(indexToDelete,1),localStorage.setItem("workoutTemplates",JSON.stringify(e)),closeConfirmModal(),displayTemplates()}}function loadTemplate(e){const t=JSON.parse(localStorage.getItem("workoutTemplates")||"[]")[e];localStorage.setItem("gym_workout_draft",JSON.stringify(t)),window.location.href="index.html"}document.addEventListener("DOMContentLoaded",displayTemplates);</script> </body> </html>
