<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#facc15">
    <link rel="apple-touch-icon" href="profile.png">
    <meta name="theme-color" content="#0b1120">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Coach Haidar | Planned </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-[#0b1120] text-slate-200 pb-24">

    <header class="bg-slate-900/90 border-b border-yellow-400/20 p-4 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="profile-img-wrapper w-12 h-12 rounded-full border-2 border-yellow-400 overflow-hidden bg-slate-800">
                    <img src="profile.png" alt="Coach Haidar" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black italic text-yellow-400 uppercase tracking-tighter">COACH HAIDAR</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Pain is temporary, greatness lasts forever</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="clearAllData()" class="text-[10px] bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white px-3 py-1.5 rounded-lg font-black transition-all border border-red-500/20 uppercase">
                    <i class="fas fa-trash-alt ml-1"></i> مسح البيانات
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto mt-8 px-4 space-y-8">
        <section class="bg-slate-800/40 p-6 rounded-2xl border-r-4 border-yellow-400 shadow-2xl max-w-2xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase px-1">اسم اللاعب</label>
                    <input type="text" id="playerName" oninput="saveDraft()" class="w-full bg-slate-900/80 border border-white/5 rounded-xl p-3 outline-none focus:border-yellow-400/50 transition-all" placeholder="أدخل اسم البطل...">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase px-1">تاريخ التحديث</label>
                    <input type="date" id="currentDate" oninput="saveDraft()" class="w-full bg-slate-900/80 border border-white/5 rounded-xl p-3 outline-none focus:border-yellow-400/50 transition-all">
                </div>
            </div>
        </section>

        <div id="daysContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

        <div class="max-w-xs mx-auto">
            <button onclick="addDay()" class="w-full py-4 border-2 border-dashed border-slate-700 rounded-2xl text-slate-500 font-bold hover:border-yellow-400 hover:text-yellow-400 transition-all group">
                <i class="fas fa-plus-circle ml-2 group-hover:scale-110 transition-transform"></i> إضافة قسم تدريبي جديد
            </button>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#0b1120] to-transparent z-[100]">
        <div class="max-w-md mx-auto">
            <button id="downloadBtn" class="w-full bg-[#facc15] hover:bg-[#eab308] text-[#0b1120] font-black py-4 rounded-2xl shadow-[0_10px_30px_rgba(250,204,21,0.3)] flex items-center justify-center gap-3 active:scale-95 transition-all group">
                <span class="text-lg">تحميل البرنامج الآن</span>
                <div class="bg-[#0b1120] text-[#facc15] w-8 h-8 rounded-lg flex items-center justify-center group-hover:rotate-12 transition-transform">
                    <i class="fas fa-file-download"></i>
                </div>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
